<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="720" viewBox="0 0 2160 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29" />
      <stop offset="50%" style="stop-color:#302b63" />
      <stop offset="100%" style="stop-color:#24243e" />
    </linearGradient>
  </defs>

  <rect width="2160" height="720" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="2160" height="6" fill="#e94560"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="714" width="2160" height="6" fill="#e94560"/>

  <!-- Left decorative bar -->
  <rect x="80" y="200" width="4" height="320" rx="2" fill="#e94560" opacity="0.6"/>

  <!-- Play triangle -->
  <polygon points="160,300 160,440 280,370" fill="#e94560"/>

  <!-- Title -->
  <text x="420" y="310" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white">FE MEDIA</text>
  <text x="420" y="410" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white">CONVERTER</text>

  <!-- Accent line under title -->
  <rect x="420" y="430" width="100" height="4" rx="2" fill="#e94560"/>

  <!-- Subtitle -->
  <text x="420" y="480" font-family="Arial, sans-serif" font-size="26" fill="#999">Convert and enhance video, audio, and images</text>

  <!-- Feature dots -->
  <circle cx="440" cy="540" r="5" fill="#e94560"/>
  <text x="455" y="545" font-family="Arial, sans-serif" font-size="18" fill="#777">H.264 / HEVC / VP9 / AV1</text>

  <circle cx="680" cy="540" r="5" fill="#e94560"/>
  <text x="695" y="545" font-family="Arial, sans-serif" font-size="18" fill="#777">FFmpeg Powered</text>

  <circle cx="870" cy="540" r="5" fill="#e94560"/>
  <text x="885" y="545" font-family="Arial, sans-serif" font-size="18" fill="#777">AI Denoising</text>

  <circle cx="440" cy="580" r="5" fill="#e94560"/>
  <text x="455" y="585" font-family="Arial, sans-serif" font-size="18" fill="#777">Queue &amp; Batch</text>

  <circle cx="620" cy="580" r="5" fill="#e94560"/>
  <text x="635" y="585" font-family="Arial, sans-serif" font-size="18" fill="#777">Drag &amp; Drop</text>

  <circle cx="780" cy="580" r="5" fill="#e94560"/>
  <text x="795" y="585" font-family="Arial, sans-serif" font-size="18" fill="#777">Multi-language</text>

  <!-- Right side decorative circle -->
  <circle cx="1850" cy="360" r="220" fill="#e94560" opacity="0.08"/>
  <circle cx="1870" cy="340" r="180" fill="#e94560" opacity="0.06"/>
  <circle cx="1890" cy="320" r="140" fill="#e94560" opacity="0.04"/>

  <!-- Bottom decorative -->
  <rect x="80" y="650" width="2000" height="2" fill="#e94560" opacity="0.15"/>
</svg>
